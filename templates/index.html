<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Interface</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container for Chat App */
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Chat Header */
        .chat-header {
            background: linear-gradient(135deg, #4a90e2, #0062cc);
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Chat Messages Section */
        .chat-box {
            flex: 1;
            padding: 15px;
            background-color: #f9f9f9;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #4a90e2;
            border-radius: 5px;
        }

        /* Chat Bubbles */
        .chat-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .chat-bubble.user {
            align-self: flex-end;
            background-color: #4a90e2;
            color: #fff;
            border-top-right-radius: 5px;
        }

        .chat-bubble.bot {
            align-self: flex-start;
            background-color: #e9e9e9;
            color: #333;
            border-top-left-radius: 5px;
        }

        /* Input Area */
        .chat-input-area {
            display: flex;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .input-box {
            flex: 1;
            border: none;
            padding: 15px;
            font-size: 1rem;
            outline: none;
        }

        .send-button {
            background: #4a90e2;
            border: none;
            color: #fff;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .send-button:hover {
            background: #0062cc;
        }

        .send-button:active {
            background: #004a99;
        }

        @media (max-width: 600px) {
            .chat-container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            Chat with the Bot 🤖
        </div>

        <!-- Chat Messages Section -->
        <div class="chat-box" id="chatBox">
            {% if response %}
                <div class="chat-bubble user">
                    <strong>You:</strong> {{ user_input }}
                </div>
                <div class="chat-bubble bot">
                    <strong>Bot:</strong> {{ response }}
                </div>
            {% endif %}
        </div>

        <!-- Input Area -->
        <form method="POST" class="chat-input-area">
            <input type="text" name="user_input" class="input-box" placeholder="Type your message here..." required>
            <button type="submit" class="send-button">Send</button>
        </form>
    </div>
</body>
</html>
